services:
  mongodb:
    image: mongo:8.0
    container_name: smartpark-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - smartpark_mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./Back
    container_name: smartpark-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      MONGODB_URI: mongodb://mongodb:27017/smartpark
    depends_on:
      mongodb:
        condition: service_healthy

volumes:
  smartpark_mongodb_data: