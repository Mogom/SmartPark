<div class="login">
  <aside class="login__art">
    <div class="login__copy">
      <h2>Cada visitante, cada minuto y cada peso, en orden.</h2>
      <p>Registra entradas, cobra por hora con vueltas exactas y cierra el turno con la caja cuadrada.</p>
    </div>
  </aside>

  <main class="login__side">
    <form class="login__form" (ngSubmit)="submit()" novalidate>
      <a routerLink="/" class="brand">
        <span class="brand__logo">P</span>
        <span class="brand__name">Smart<span>Park</span></span>
      </a>

      <div class="login__title">
        <h1>Iniciar sesión</h1>
        <p>{{ sede }}</p>
      </div>

      <label class="field">Usuario o correo
        <input name="user" [(ngModel)]="user" (ngModelChange)="error = ''" placeholder="porteria@altosdelparque.co" autocomplete="username">
      </label>

      <label class="field">
        <span class="field__row">
          <span>Contraseña</span>
          <button type="button" class="link-btn" (click)="showPassword = !showPassword">{{ showPassword ? 'Ocultar' : 'Mostrar' }}</button>
        </span>
        <input name="password" [type]="showPassword ? 'text' : 'password'" [(ngModel)]="password" (ngModelChange)="error = ''" placeholder="••••••••" autocomplete="current-password">
      </label>

      <div class="login__opts">
        <button type="button" class="check" (click)="remember = !remember" [attr.aria-pressed]="remember">
          <span class="check__box" [class.on]="remember">@if (remember) { ✓ }</span>
          Recordar este equipo
        </button>
        <a routerLink="/recuperar" class="link">¿Olvidaste tu contraseña?</a>
      </div>

      @if (error) { <div class="error">{{ error }}</div> }

      <button type="submit" class="btn" [disabled]="loading">{{ loading ? 'Ingresando…' : 'Ingresar' }}</button>
      <p class="hint">Después de ingresar eliges los porteros de turno.</p>
    </form>
  </main>
</div>
